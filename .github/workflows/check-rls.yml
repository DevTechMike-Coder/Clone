# ============================================================================
# RLS / security regression guard
# ============================================================================
# Replays the full migration chain against the Supabase local stack and asserts
# the RLS security invariants the app depends on. Catches the class of bug that
# already happened once: a later migration silently re-opening a policy (e.g.
# 20260507000000_chat_policies.sql exposed conversations/messages to any
# authenticated user before 20260828120000_security_hardening.sql fixed it).
#
#   step "assert RLS invariants"  -> scripts/check-rls.mjs   (hard gate)
#   step "snapshot diff"          -> --compare-snapshot      (hard gate)
#     The snapshot baseline is supabase/rls_snapshot.json. Regenerate it after an
#     intentional, reviewed policy change:
#       node scripts/check-rls.mjs --update-snapshot
#     and inspect the diff before committing.
# ============================================================================
name: RLS security guard

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-rls:
    runs-on: ubuntu-latest
    # Single place to bump the CLI. Do NOT switch back to `version: latest`:
    # setup-cli@v1 resolved `latest` via the unauthenticated GitHub releases
    # API, which flakes with "Failed to resolve latest Supabase CLI release:
    # rate limit exceeded" and then fails every later step with
    # "supabase: command not found". A pinned version is reproducible and
    # needs no "latest" lookup at all. Check
    # https://github.com/supabase/cli/releases for breaking changes before
    # bumping.
    env:
      SUPABASE_CLI_VERSION: 2.117.0
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # v3 installs the CLI from npm (no GitHub releases API call, no Node 20
      # runtime deprecation warning like v1). continue-on-error lets the npm
      # fallback below recover if the action itself ever flakes.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
        continue-on-error: true

      - name: Ensure Supabase CLI is available (npm fallback)
        run: |
          if ! command -v supabase >/dev/null 2>&1; then
            echo "setup-cli action did not provide a supabase binary, falling back to npm..."
            npm install -g "supabase@${SUPABASE_CLI_VERSION}"
          fi
          supabase --version

      - name: Boot Supabase local stack and apply migrations
        run: |
          supabase start
          # --no-seed: the repo seeds its audio catalog via scripts/seed-music.mjs,
          # not an SQL seed file; this job only needs the migration schema.
          supabase db reset --no-seed

      - name: Assert RLS invariants
        run: |
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres \
            npm run check:rls

      - name: Compare pg_policies against the expected snapshot
        run: |
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres \
            npm run check:rls:compare-snapshot

      - name: Stop Supabase
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup || supabase stop || true
          else
            echo "Supabase CLI not installed, skipping stop."
          fi